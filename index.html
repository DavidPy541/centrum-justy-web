<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Centrum JUSTY z.ú.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F2E7;
    --ink:#2A2924;
    --ink-soft:#5A574C;
    --terracotta:#2F6690;
    --terracotta-dark:#1F4A69;
    --line:#DED2B4;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-family:'Work Sans',sans-serif;text-align:center;padding:32px;}
  .box{max-width:480px;}
  .box img{height:64px;margin-bottom:28px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:28px;margin:0 0 16px;color:var(--ink);}
  p{font-size:16px;color:var(--ink-soft);line-height:1.6;margin:0 0 8px;}
  .contact{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-soft);}
  .contact a{color:var(--terracotta-dark);text-decoration:none;font-weight:500;}
</style>
</head>
<body>
  <div class="box">
    <img src="assets/logo.png" alt="Centrum JUSTY z.ú.">
    <h1>Připravujeme pro vás nové stránky</h1>
    <p>Brzy budeme zpět.</p>
    <div class="contact">
      <p>Centrum JUSTY z.ú.</p>
      <p>Tel: 602 214 797 &nbsp;·&nbsp; <a href="mailto:centrumjusty@gmail.com">centrumjusty@gmail.com</a></p>
    </div>
  </div>
</body>
</html>
